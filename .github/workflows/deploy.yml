name: Validate and deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ravafry-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:ci
      - run: npm test
      - run: npm run build:apps-script
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser:live
      - name: Deploy this Worker only
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.135.0'
          secrets: |
            TURNSTILE_SECRET_KEY
            RSVP_UPSTREAM_URL
            RSVP_SHARED_SECRET
            RSVP_SESSION_SECRET
        env:
          WRANGLER_SEND_METRICS: 'false'
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          RSVP_UPSTREAM_URL: ${{ secrets.RSVP_UPSTREAM_URL }}
          RSVP_SHARED_SECRET: ${{ secrets.RSVP_SHARED_SECRET }}
          RSVP_SESSION_SECRET: ${{ secrets.RSVP_SESSION_SECRET }}
